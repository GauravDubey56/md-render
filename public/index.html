<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Viewer</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" id="hljs-light" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github.min.css">
  <link rel="stylesheet" id="hljs-dark" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css">
  <script>
    // Theme: 'auto' (follow OS) | 'light' | 'dark'. Runs before paint to avoid a flash.
    window.applyTheme = (pref) => {
      const dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.getElementById('hljs-dark').disabled = !dark;
    };
    let pref = 'auto';
    try { pref = localStorage.getItem('md-viewer-theme') || 'auto'; } catch {}
    applyTheme(pref);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
</head>
<body>
  <aside id="sidebar">
    <div class="side-head">
      <div class="root-name" id="rootName" title="">…</div>
      <button id="rescanBtn" class="icon-btn" title="Rescan folders">⟳</button>
    </div>
    <input id="filter" type="search" placeholder="Filter files…  ( / )" autocomplete="off">
    <div class="count" id="count"></div>
    <nav id="tree"></nav>
  </aside>

  <main id="main">
    <header id="toolbar">
      <div id="crumbs"></div>
      <div class="actions">
        <button id="copyDocBtn" title="Copy the whole document as rich text (tables + diagrams as images) for Google Docs / Word / Notion">Copy for Docs</button>
        <button id="copyMdBtn" title="Copy the raw markdown source">Copy Markdown</button>
        <button id="copyTextBtn" title="Copy as plain text">Copy Text</button>
        <button id="themeBtn" title="Switch theme: auto (follow OS) → light → dark"></button>
        <button id="printBtn" title="Print or save as PDF">Print / PDF</button>
      </div>
    </header>
    <article id="content" class="markdown-body">
      <div class="empty">Pick a markdown file from the left.</div>
    </article>
  </main>

  <div id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
